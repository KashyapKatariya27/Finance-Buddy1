services:
  - type: web
    name: finance-buddy
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: finance-buddy-data
      mountPath: /var/data
      sizeGB: 1
